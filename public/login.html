<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход — WhatsApp Рассылка</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: -30%; left: -20%;
      width: 60%; height: 60%;
      background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 60%);
      pointer-events: none;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%; right: -20%;
      width: 50%; height: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 60%);
      pointer-events: none;
      animation: floatGlow 10s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatGlow {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, -20px) scale(1.1); }
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo-icon {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      margin-bottom: 18px;
      position: relative;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .login-logo-icon::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
      border-radius: 22px;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(16,185,129,0.3); }
      50% { box-shadow: 0 8px 48px rgba(16,185,129,0.45), 0 0 60px rgba(16,185,129,0.15); }
    }
    .login-logo h1 {
      font-size: 26px;
      color: var(--text-primary);
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.03em;
    }
    .login-logo p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(16,185,129,0.03);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(16,185,129,0.3), rgba(59,130,246,0.2), transparent);
    }
    .login-card .form-group { margin-bottom: 22px; }
    .login-card .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .login-card .form-input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
      box-sizing: border-box;
      font-family: inherit;
    }
    .login-card .form-input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12), 0 0 24px rgba(16,185,129,0.06);
      background: var(--bg-card-solid);
    }
    .login-error {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: var(--red);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-green);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255,255,255,0.12);
      font-family: inherit;
      letter-spacing: -0.01em;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .form-input {
      padding-left: 44px;
    }
    .input-icon-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
      transition: color 0.2s;
    }
    .input-icon-wrap:focus-within .input-icon {
      color: var(--green);
    }
    .theme-toggle-login {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .theme-toggle-login:hover {
      background: var(--bg-card-hover);
      color: var(--green);
      border-color: rgba(16,185,129,0.3);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <button class="theme-toggle-login" onclick="toggleLoginTheme()" title="Сменить тему">
    <i class="ph-duotone ph-sun" id="themeIcon"></i>
  </button>

  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-icon">
        <i class="ph-duotone ph-whatsapp-logo"></i>
      </div>
      <h1>WA Рассылка</h1>
      <p>Вход в платформу WhatsApp рассылки</p>
    </div>
    
    <div class="login-card">
      <div class="login-error" id="loginError">
        <i class="ph-duotone ph-warning-circle"></i>
        <span id="loginErrorText"></span>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Логин</label>
          <div class="input-icon-wrap">
            <i class="ph-duotone ph-user input-icon"></i>
            <input type="text" class="form-input" id="loginUsername" placeholder="Введите логин" autocomplete="username" required autofocus/>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="input-icon-wrap">
            <i class="ph-duotone ph-lock input-icon"></i>
            <input type="password" class="form-input" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password" required/>
          </div>
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          <i class="ph-duotone ph-sign-in" style="font-size:20px"></i>
          Войти
        </button>
      </form>
    </div>
  </div>

<script>
  function toggleLoginTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ph-duotone ph-sun' : 'ph-duotone ph-moon';
  }
  // Init icon
  document.getElementById('themeIcon').className = (localStorage.getItem('theme') || 'dark') === 'dark' ? 'ph-duotone ph-sun' : 'ph-duotone ph-moon';

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    const errText = document.getElementById('loginErrorText');
    
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    if (!username || !password) {
      errEl.style.display = 'flex';
      errText.textContent = 'Введите логин и пароль';
      return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="ph-duotone ph-spinner-gap" style="font-size:20px;animation:spin 1s linear infinite"></i> Вход...';
    errEl.style.display = 'none';
    
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.error || 'Произошла ошибка');
      }
      
      // Успешный вход — redirect
      window.location.href = '/';
    } catch (err) {
      errEl.style.display = 'flex';
      errText.textContent = err.message;
      btn.disabled = false;
      btn.innerHTML = '<i class="ph-duotone ph-sign-in" style="font-size:20px"></i> Войти';
    }
  }
</script>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
