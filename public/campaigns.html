<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Кампании — WhatsApp Рассылка</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="ph-duotone ph-device-mobile" style="font-size: 1.1em; vertical-align: middle;"></i></div>
    <div class="logo-text"><span class="logo-title">WA Рассылка</span><span class="logo-sub">Платформа WhatsApp</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <div class="ws-status"><div class="ws-dot" id="wsDot"></div><span id="wsLabel">Подключение...</span></div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="ph-bold ph-list"></i></button>
      <div>
        <div class="topbar-title"><i class="ph-duotone ph-clipboard-text" style="font-size: 1.1em; vertical-align: middle;"></i> История кампаний</div>
        <div class="topbar-sub">Все операции по рассылке</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-secondary btn-sm" id="themeToggleBtn" onclick="toggleTheme()" style="font-size: 16px; padding: 6px 10px;" title="Сменить тему"><i class="ph-duotone ph-sun" style="font-size: 1.1em; vertical-align: middle;"></i></button>
      
      <a href="/send" class="btn btn-primary"><span><i class="ph-duotone ph-rocket-launch" style="font-size: 1.1em; vertical-align: middle;"></i></span> <span class="btn-text">Новая рассылка</span></a>
    </div>
  </header>

  <div class="page-content">
    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr id="tableHeaderRow">
              <th>#</th>
              <th>Название кампании</th>
              <th>Статус</th>
              <th>Прогресс</th>
              <th>Отправлено</th>
              <th>Ошибка</th>
              <th>Всего</th>
              <th>Начато</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="campaignsBody">
            <tr><td colspan="9"><div class="empty-state"><div class="empty-icon"><i class="ph-duotone ph-hourglass-medium" style="font-size: 1.1em; vertical-align: middle;"></i></div><div class="empty-title">Загрузка...</div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Campaign detail modal -->
<div class="modal-overlay" id="campaignModal">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <div class="modal-title" id="campaignModalTitle">Данные кампании</div>
      <div class="modal-close" onclick="closeCampaignModal()">✕</div>
    </div>
    <div class="modal-body">
      <div id="campaignDetail"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeCampaignModal()">Закрыть</button>
      <button class="btn btn-danger" id="deleteCampaignBtn" onclick="deleteCampaign()"><i class="ph-duotone ph-trash" style="font-size: 1.1em; vertical-align: middle;"></i> Удалить</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script>
  let currentCampaignId = null;

  const statusMap = {
    completed: ['badge-green','<i class="ph-duotone ph-check-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--green);"></i> Завершено'],
    running:   ['badge-blue','<i class="ph-duotone ph-hourglass-medium" style="font-size: 1.1em; vertical-align: middle;"></i> Отправляется'],
    cancelled: ['badge-yellow','<i class="ph-duotone ph-stop-circle" style="font-size: 1.1em; vertical-align: middle;"></i> Остановлено'],
    pending:   ['badge-gray','<i class="ph-duotone ph-clock" style="font-size: 1.1em; vertical-align: middle;"></i> Ожидает'],
    failed:    ['badge-red','<i class="ph-duotone ph-x-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--red);"></i> Ошибка']
  };

  async function loadCampaigns() {
    try {
      if (!currentUser) await checkAuth();
      const isSuper = currentUser && currentUser.role === 'superadmin';

      const headerRow = document.getElementById('tableHeaderRow');
      if (headerRow) {
        if (isSuper) {
          headerRow.innerHTML = `
            <th>#</th><th>Название кампании</th><th>Админ</th><th>Тариф</th>
            <th>Статус</th><th>Прогресс</th><th>Отправлено</th><th>Ошибка</th>
            <th>Всего</th><th>Начато</th><th>Действие</th>`;
        } else {
          headerRow.innerHTML = `
            <th>#</th><th>Название кампании</th>
            <th>Статус</th><th>Прогресс</th><th>Отправлено</th><th>Ошибка</th>
            <th>Всего</th><th>Начато</th><th>Действие</th>`;
        }
      }

      const res = await fetch('/api/campaigns');
      const data = await res.json();
      const body = document.getElementById('campaignsBody');
      if (!data.length) {
        body.innerHTML = `<tr><td colspan="${isSuper ? 11 : 9}"><div class="empty-state"><div class="empty-icon"><i class="ph-duotone ph-tray" style="font-size: 1.1em; vertical-align: middle;"></i></div><div class="empty-title">Нет кампаний</div><div class="empty-text"><a href="/send" style="color:var(--green)">Начните первую рассылку →</a></div></div></td></tr>`;
        return;
      }
      body.innerHTML = data.map(c => {
        const [bc, bl] = statusMap[c.status] || statusMap.pending;
        const pct = c.total_count > 0 ? Math.round((c.sent_count / c.total_count) * 100) : 0;
        const date = new Date(c.created_at).toLocaleDateString('ru-RU', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        
        let superCols = '';
        if (isSuper) {
          superCols = `
            <td><strong>${c.admin_name || '—'}</strong></td>
            <td><span class="badge badge-blue">${c.tariff_name || '—'}</span></td>
          `;
        }

        return `<tr>
          <td style="color:var(--text-muted);font-size:12px">#${c.id}</td>
          <td><strong>${c.name}</strong><div style="font-size:11px;color:var(--text-muted);margin-top:2px">${c.message.substring(0,50)}${c.message.length>50?'...':''}</div></td>
          ${superCols}
          <td><span class="badge ${bc}">${bl}</span></td>
          <td style="min-width:120px">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="progress-wrap" style="flex:1"><div class="progress-bar" style="width:${pct}%"></div></div>
              <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">${pct}%</span>
            </div>
          </td>
          <td><span style="color:var(--green);font-weight:700">${c.sent_count}</span></td>
          <td><span style="color:var(--red)">${c.failed_count}</span></td>
          <td>${c.total_count}</td>
          <td style="color:var(--text-muted);font-size:12px">${date}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="viewCampaign(${c.id})"><i class="ph-duotone ph-eye" style="font-size: 1.1em; vertical-align: middle;"></i></button>
          </td>
        </tr>`;
      }).join('');
    } catch(e) { console.error(e); }
  }

  async function viewCampaign(id) {
    currentCampaignId = id;
    document.getElementById('campaignModal').classList.add('open');
    document.getElementById('campaignDetail').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="ph-duotone ph-hourglass-medium" style="font-size: 1.1em; vertical-align: middle;"></i></div><div class="empty-title">Загрузка...</div></div>';
    try {
      const res = await fetch(`/api/campaigns/${id}`);
      const { campaign, logs } = await res.json();
      document.getElementById('campaignModalTitle').textContent = campaign.name;
      const [bc, bl] = statusMap[campaign.status] || statusMap.pending;
      const pct = campaign.total_count > 0 ? Math.round((campaign.sent_count / campaign.total_count) * 100) : 0;

      const sentLogs = logs.filter(l => l.status === 'sent');
      const failedLogs = logs.filter(l => l.status === 'failed');
      const pendingLogs = logs.filter(l => l.status === 'pending');

      document.getElementById('campaignDetail').innerHTML = `
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
          <span class="badge ${bc}">${bl}</span>
          <span class="badge badge-green"><i class="ph-duotone ph-check-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--green);"></i> ${campaign.sent_count} отправлено</span>
          <span class="badge badge-red"><i class="ph-duotone ph-x-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--red);"></i> ${campaign.failed_count} ошибок</span>
          <span class="badge badge-gray"><i class="ph-duotone ph-hourglass-medium" style="font-size: 1.1em; vertical-align: middle;"></i> ${pendingLogs.length} в ожидании</span>
        </div>
        <div class="progress-wrap progress-lg" style="margin-bottom:20px">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        <div style="background:var(--bg-secondary);border-radius:var(--radius);padding:14px;margin-bottom:20px;font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap">${campaign.message}</div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-sm ${failedLogs.length?'btn-secondary':'btn-ghost'}" onclick="filterLogs('all')" id="filterAll">Все (${logs.length})</button>
          <button class="btn btn-sm btn-ghost" onclick="filterLogs('sent')" id="filterSent"><i class="ph-duotone ph-check-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--green);"></i> Отправлено (${sentLogs.length})</button>
          <button class="btn btn-sm btn-ghost" onclick="filterLogs('failed')" id="filterFailed"><i class="ph-duotone ph-x-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--red);"></i> Ошибка (${failedLogs.length})</button>
        </div>
        <div id="logsList" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
          ${renderLogs(logs)}
        </div>
      `;

      window._campaignLogs = logs;
    } catch(e) { console.error(e); }
  }

  function renderLogs(logs) {
    if (!logs.length) return '<div style="text-align:center;padding:20px;color:var(--text-muted)">Нет записей</div>';
    return logs.map(l => {
      const icon = l.status === 'sent' ? '<i class="ph-duotone ph-check-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--green);"></i>' : l.status === 'failed' ? '<i class="ph-duotone ph-x-circle" style="font-size: 1.1em; vertical-align: middle; color: var(--red);"></i>' : '<i class="ph-duotone ph-hourglass-medium" style="font-size: 1.1em; vertical-align: middle;"></i>';
      const time = l.sent_at ? new Date(l.sent_at).toLocaleTimeString('ru-RU') : '—';
      return `<div class="feed-item">
        <span style="font-size:16px">${icon}</span>
        <div style="flex:1">
          <div style="font-weight:500">${l.client_name}</div>
          ${l.error_message ? `<div style="font-size:11px;color:var(--red)">${l.error_message}</div>` : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);text-align:right">
          <div class="phone-badge">${l.phone}</div>
          <div style="margin-top:2px">${time}</div>
        </div>
      </div>`;
    }).join('');
  }

  function filterLogs(status) {
    const logs = window._campaignLogs || [];
    const filtered = status === 'all' ? logs : logs.filter(l => l.status === status);
    document.getElementById('logsList').innerHTML = renderLogs(filtered);
    document.querySelectorAll('[id^=filter]').forEach(b => b.className = 'btn btn-sm btn-ghost');
    document.getElementById('filter' + status.charAt(0).toUpperCase() + status.slice(1)).className = 'btn btn-sm btn-secondary';
  }

  function closeCampaignModal() { document.getElementById('campaignModal').classList.remove('open'); currentCampaignId = null; }

  async function deleteCampaign() {
    if (!currentCampaignId) return;
    if (!confirm('Удалить кампанию?')) return;
    try {
      await fetch(`/api/campaigns/${currentCampaignId}`, { method: 'DELETE' });
      closeCampaignModal();
      showToast('Кампания удалена', 'success');
      loadCampaigns();
    } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
  }

  loadCampaigns();
  setInterval(loadCampaigns, 15000);
</script>
</body>
</html>
